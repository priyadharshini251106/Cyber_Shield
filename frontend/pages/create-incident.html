<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Incident - CyberShield</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>
    <button
    id="themeToggle"
    class="theme-toggle"
    type="button">
    🌙
</button>

    <header class="navbar">

        <div class="logo">
            CyberShield
        </div>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="incidents.html">
                Incidents
            </a>

            <a href="#" id="logoutButton">
                Logout
            </a>

        </nav>

    </header>


    <main class="form-page">

        <div class="form-container">

            <h2 id="formTitle">
                Create Incident
            </h2>


            <p class="form-description">

                Report a cybersecurity incident.

            </p>


            <form id="incidentForm">


                <div class="form-group">

                    <label for="title">
                        Incident Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter incident title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Describe the incident"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select category
                        </option>

                        <option value="PHISHING">
                            Phishing
                        </option>

                        <option value="MALWARE">
                            Malware
                        </option>

                        <option value="UNAUTHORIZED_ACCESS">
                            Unauthorized Access
                        </option>

                        <option value="DATA_BREACH">
                            Data Breach
                        </option>

                        <option value="SUSPICIOUS_ACTIVITY">
                            Suspicious Activity
                        </option>

                        <option value="OTHER">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="severity">
                        Severity
                    </label>

                    <select id="severity" required>

                        <option value="">
                            Select severity
                        </option>

                        <option value="LOW">
                            Low
                        </option>

                        <option value="MEDIUM">
                            Medium
                        </option>

                        <option value="HIGH">
                            High
                        </option>

                        <option value="CRITICAL">
                            Critical
                        </option>

                    </select>

                </div>


                <div
                    class="form-group"
                    id="statusGroup"
                    style="display:none;"
                >

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="OPEN">
                            Open
                        </option>

                        <option value="IN_PROGRESS">
                            In Progress
                        </option>

                        <option value="RESOLVED">
                            Resolved
                        </option>

                        <option value="CLOSED">
                            Closed
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="form-button"
                    id="submitButton"
                >
                    Create Incident
                </button>


            </form>


            <p
                id="message"
                class="message"
            ></p>


            <p class="form-link">

                <a href="incidents.html">
                    ← Back to Incidents
                </a>

            </p>

        </div>

    </main>


    <script src="../js/create-incident.js"></script>
    <script src="../js/theme.js"></script>

</body>

</html>
